<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慧舟會 練習ログ</title>
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>

<div class="header">
  <div class="eyebrow">和術慧舟會 / Training Log</div>
  <h1 id="dojoTitle">練習記録</h1>
  <div class="sub">あなた専用の練習ログ＆スキル分析</div>
</div>

<div class="app">
  <div class="sync-bar" id="syncBar"></div>
  <div class="dojo-select" id="dojoSelect"></div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="calendar">カレンダー</button>
    <button class="tab" data-tab="focus">今日の意識</button>
    <button class="tab" data-tab="skill">スキル</button>
    <button class="tab" data-tab="history">ノート</button>
    <button class="tab" data-tab="past">過去実績</button>
    <button class="tab" data-tab="goal">目標設定</button>
  </div>
  <div class="content" id="content"></div>
  <footer>WAJUTSU KEISHUKAI · CLOUD SYNC (FIREBASE)</footer>
</div>

<div id="modalRoot"></div>

</body>
</html>
